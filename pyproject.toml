[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llove"]

[tool.hatch.build.targets.sdist]
include = [
    "/llove",
    "/tests",
    "/docs",
    "/README.md",
    "/REQUIREMENTS.md",
    "/ROADMAP.md",
    "/LICENSE",
    "/pyproject.toml",
]

[project]
name = "llove"
version = "0.2.0"
description = "llove — a cute, terminal-first Artifact for inspecting LLMesh data with llove"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kazufumi Furuse", email = "kazufumi@furuse.work" }]
keywords = ["llm", "mesh", "tui", "terminal", "dashboard", "artifact", "industrial-iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=0.80",
    "rich>=13.7",
    "click>=8.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
plots = [
    "textual-plotext>=0.2",
]
llmesh = [
    "llmesh-mcp>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "bandit>=1.8",
    "mypy>=1.10",
]
all = [
    "textual-plotext>=0.2",
    "llmesh-mcp>=3.1",
]

[project.scripts]
llove = "llove.cli:main"

[project.urls]
Homepage = "https://github.com/furuse-kazufumi/llove"
Issues = "https://github.com/furuse-kazufumi/llove/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Stricter ruleset, mirroring the LLMesh approach:
#   E/W       pycodestyle errors and warnings
#   F         pyflakes
#   I         isort
#   B         bugbear (likely-bug patterns)
#   UP        pyupgrade
#   SIM       simplify suggestions
#   RUF       ruff-specific
#   PTH       pathlib over os.path
#   PLE       pylint errors
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "PLE"]
ignore = ["E501"]

[tool.bandit]
# Project-policy skips:
#  B101 — assert: used for module-level invariants
#  B110/B112 — try/except/pass|continue: fail-closed dispatch is intentional
#  B311 — random: only used for synthetic demo data, never for security
skips = ["B101", "B110", "B112", "B311"]
exclude_dirs = ["tests"]
