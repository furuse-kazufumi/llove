services:
  dev:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONUTF8: "1"
      TERM: xterm-256color
    tty: true
    stdin_open: true
    command: >
      bash -c "pip install -e '.[dev,all]' &&
               echo '💗 llove dev container ready. Try: llove demo' &&
               bash"
