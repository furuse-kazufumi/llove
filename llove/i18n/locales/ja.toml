# llove — 日本語ロケール

[ui]
title = "💗 llove"
subtitle = "Made with llove — LLMesh をやさしく見守る"
hint_bar = "[bold]↑ ボタン[/bold] = クリック可能なコントロール   ·   [bold]↓ パネル[/bold] = 表示専用のデータ表示   ·   キー: q 終了 · r リセット · space 一時停止 · h ヘルプ"

[ui.button]
pause = "⏸ 一時停止"
resume = "▶ 再開"
reset = "⟲ リセット"
help = "? ヘルプ"
quit = "✕ 終了"

[ui.help]
title = "[bold]💗 llove — ヘルプ[/bold]\n[bold yellow]ESC キー (または h / q / 閉じるボタン) で元の画面に戻ります。[/bold yellow]\n"
body = """
[bold]マウスでクリックできるコントロール (上部)[/bold]
  ⏸ 一時停止 / ▶ 再開     データストリームの一時停止/再開
  ⟲ リセット              全パネルのロール内容を消去
  ? ヘルプ                 このヘルプを開く (今ここ)
  ✕ 終了                   llove を終了

[bold]キーボードショートカット[/bold]
  q       終了
  r       表示リセット
  space   一時停止 / 再開
  h       このヘルプを開く / 閉じる
  esc     このヘルプを閉じる

[bold]パネル (読み取り専用)[/bold]
  📡 センサーイベント・ストリーム — 直近 40 件の値とスパークライン
  📊 SPC 管理図                  — CUSUM の状態と直近の警報ログ
  📋 監査ログ                    — audit / LLM call / RAG hit (新しい順)
  💬 解説                        — シナリオの解説 (--scenario 実行時)

[bold]ヒント[/bold]
  下部 Footer の (q 終了, r リセット, ...) もクリックできます。
"""
close = "閉じる (esc)"

[ui.pane.sensor_stream]
title = "📡 センサーイベント・ストリーム  · 📖 読み取り専用"
subtitle_init = "(データ待機中)"
subtitle_active = "{count} 件 | 直近 {latest}"
header = "時刻      センサー              値"
sparkline_label = "推移グラフ (直近 40 件):"
empty = "(データはまだありません)"

[ui.pane.spc_chart]
title = "📊 SPC 管理図 — CUSUM 累積和  · 📖 読み取り専用"
subtitle_init = "ドリフト監視中"
subtitle_alarmed = "⚠ 警報 {count} 件"
status_alarm = "[bold red]●[/bold red] 状態: 警報"
status_nominal = "[bold green]●[/bold green] 状態: 正常  (値={value})"
status_waiting = "[dim]●[/dim] 状態: データ待機中"
recent_alarms = "  直近の警報:"
no_alarms = "  (警報なし)"
as_of = "[dim]{ts} 時点[/dim]"

[ui.pane.audit_log]
title = "📋 監査ログ — audit / LLM / RAG イベント  · 📖 読み取り専用"
subtitle_init = "新しい順"
empty = "(監査イベントはまだありません)"

[ui.pane.narration]
title = "💬 解説 — 何が起きているかを言葉で  · 📖 読み取り専用"
subtitle_init = "(シナリオ解説)"
subtitle_active = "場面 {beat} · {latest}"
empty = "[dim](解説はまだありません — シナリオの開始を待っています)[/dim]"

[scenario.firewall]
title = "Firewall — プロンプトの 4 層検査"
description = "12 件のプロンプトを各層 (L0/L1/L1.5/L2) が ALLOW / BLOCK / SUMMARIZE に振り分ける様子を再生。"
intro_title = "シナリオ: PromptFirewall 4 層"
intro = "**LLMesh PromptFirewall** は 4 層を優先順位付きで実行します。各プロンプトをどの層が捕まえるかに注目 — 早い層が必ず勝ちます。"
takeaway_title = "ポイント"
takeaway = "**層の順序が重要。** L0 が注入パターン → L1 がシークレット → L1.5 が PII → L2 が構造、の順で先に評価され、早い層が後の層を覆い隠します（仕様）。"
prompt_line = "prompt: `{shown}`\n  → **{layer}** → **{action}** ({reason})"

[scenario.scada]
title = "SCADA — ExplainedCUSUM と LLM 仮説生成"
description = "軸受け温度センサーが管理限界を逸脱。ExplainedCUSUM が警報を検出し、LLM が原因仮説を出します。"
intro_title = "シナリオ: SCADA"
intro = "**SCADA + ExplainedCUSUM**: 軸受け温度センサーが管理限界を超えてドリフトします。CUSUM が累積偏差を検出し、LLM 説明器が原因の仮説を添えます。"
phase1_title = "フェーズ 1"
phase1 = "フェーズ 1 — **正常運転**: 温度は 70 °C 前後で安定"
phase2_title = "フェーズ 2"
phase2 = "フェーズ 2 — **ドリフト**: `lubricant_flow_03` で潤滑油の粘度が低下し、軸受けの温度が上昇"
phase3_title = "フェーズ 3"
phase3 = "フェーズ 3 — 保守作業後の **復旧**"
llm_title = "LLM"
llm_triggered = "**LLM 説明器** が起動 — インシデントレポートを生成中"
hypothesis = "累積ドリフトは約 12 分前から始まっており、lubricant_flow_03 の粘度低下と相関しています。軸受けの摩耗または潤滑油の劣化が考えられます。潤滑油圧と振動スペクトルの確認を推奨します。"
takeaway_title = "ポイント"
takeaway = "ExplainedCUSUM = **CUSUMChart + LLMExplainer** の合成。数値ドリフトで警報が出ると、LLM が自然言語で原因仮説を添えてくれます。"

[scenario.multimodal]
title = "マルチモーダル SPC — センサー + 画像キャプションの融合"
description = "振動センサーと画像キャプションを並行して流し、両方が異常を示した時だけ UnifiedSPC の AND ルールで警報を発火。"
intro_title = "シナリオ: マルチモーダル SPC"
intro = "**UnifiedSPC** は 2 系統 (数値センサー + 画像キャプション) を AND / OR / Weighted で結合できます。ここでは AND を使い、**両方** が限界を超えた時だけ警報します。"
phase_a_title = "フェーズ A"
phase_a = "フェーズ A — センサー正常・画像正常 → **警報なし** (AND 不成立)"
phase_b_title = "フェーズ B"
phase_b = "フェーズ B — 画像が疑わしいがセンサーは正常 → AND ルールが警報を **抑止**"
phase_c_title = "フェーズ C"
phase_c = "フェーズ C — 振動も上昇 **かつ** 画像も疑わしい → **警報**: 両系統が一致"
takeaway_title = "ポイント"
takeaway = "UnifiedSPC は **モダリティ間の合意を要求** することで誤警報を減らせます。AND で精度重視 (プロセス制御)、OR で再現率重視 (安全) に。"

[scenario.rag]
title = "RAG — 3 つのベクトルストアを比較"
description = "同じクエリを NumpyVectorStore / SqliteVectorStore / LSHVectorStore の 3 種で実行し、レイテンシと recall を比較。"
intro_title = "シナリオ: RAG ストア比較"
intro = "**llmesh.rag** には 3 つのストアがあります。共通の `Retriever` ABC、スケールが異なります。同一クエリを 3 種類で実行します。"
query_title = "クエリ"
query = "クエリ: `{q}`"
running = "実行中: **{name}** ({scale}) — {note}"
takeaway_title = "ポイント"
takeaway = "**人気ではなく規模で選ぶ。** プロトタイプは Numpy、典型的な本番 (≤ 10⁶) は SQLite、100 万件超なら LSH ANN。"

[scenario.backends]
title = "LLM バックエンド — Ollama / OpenAI / Anthropic"
description = "同じプロンプトをローカル 1 種 + クラウド 2 種に投げ、tokens / latency / cost を比較。"
intro_title = "シナリオ: LLM バックエンド"
intro = "**llmesh.llm** はコンストラクタを 1 行変えるだけでバックエンドを切り替えられます。同じプロンプトを 3 種類のバックエンドに投げます (他のコードはそのまま)。"
prompt_title = "プロンプト"
prompt = "プロンプト: `{q}`"
calling = "呼び出し中: **{backend}** — モデル `{model}`  ({note})"
takeaway_title = "ポイント"
takeaway = "ローカル合計 = {local_ms} ms (無料) · クラウド合計 = {cloud_ms} ms (低コスト)。**開発はローカル、難しいプロンプトはクラウド** が定石。"

[scenario.audit]
title = "監査 — HMAC チェーンによる改ざん検知"
description = "監査エントリを追加 → 1 件改ざん → verify_chain() が破断を検知する流れを再生。"
intro_title = "シナリオ: 監査チェーン"
intro = "**AuditTrail** はすべてのエントリの HMAC を次のエントリに連鎖させます。1 件でも削除/変更されればチェーンが破断し、`verify_chain()` が例外を投げます。"
step1_title = "ステップ 1"
step1 = "**ステップ 1.** 5 件のエントリを追加 — 各エントリには前のエントリの HMAC が `prev_hmac` として連鎖されます"
step2_title = "ステップ 2 — 改ざん"
step2 = "**ステップ 2.** 攻撃者がエントリ **#3** を書き換える。保存されている HMAC が、#4 が連鎖していた `prev_hmac` と整合しなくなる。"
step3_title = "ステップ 3 — 検証"
step3 = "**ステップ 3.** 運用者が `verify_chain()` を実行 — #4 の `prev_hmac` が #3 を再計算した HMAC と一致しない → **seq=3 でチェーン破断**"
takeaway_title = "ポイント"
takeaway = "改ざん**耐性**ではなく改ざん**検知**。攻撃者は履歴を黙って書き換えられず、破断点が法的証拠になります。"

[scenario.cost]
title = "コスト — トークン消費が日次予算を突破"
description = "7 件の LLM 呼び出しを再生し、累積コストが日次予算を超えて SPC アラームが発火する流れを表示。"
intro_title = "シナリオ: コスト予算"
intro = "**トークン消費は経営事項。** 7 件の LLM 呼び出し (ローカル + 安価クラウド + 数件の `gpt-4o`) を再生します。日次予算は **{budget}**。累積コストが予算を突破すると SPC アラームが発火します。"
breached_title = "予算突破"
breached = "{n} 回目の呼び出し直後に累積が **{total}** に達し、日次予算を突破。`daily_cost_usd` で SPC アラームが発火しました。"
llm_explain_title = "LLM 原因解析"
llm_explain = "**LLM 解析**: 大きな `gpt-4o` 3 件が当日支出の約 95% を占めます。それ以前の `gpt-4o-mini` とローカル `llama3.2` 単体では予算内でした。"
takeaway_title = "ポイント"
takeaway = "セッション合計 = **{total}**。**長いプロンプトは安価モデル (haiku / mini / ローカル) にルーティング** し、`gpt-4o` は品質要件をゲートにしてデフォルト化しないこと。"

[scenario.chat]
title = "チャット — Firewall 介入付きの LLM 対話ストリーム"
description = "user/assistant 9 ターンを再生。途中の prompt injection ターンを L0 で遮断、残りの会話は継続。"
intro_title = "シナリオ: チャットストリーム"
intro = "**ライブチャット**: user/assistant のやりとりが LLM 呼び出しペインを流れます。途中で prompt injection 試行が firewall に捕捉されて audit に記録、会話自体は止まりません。"
blocked_title = "Firewall 遮断"
blocked = "ターンが **{layer} 層** で遮断され、モデルに到達しませんでした。audit に記録されており、ユーザは普通に質問し直せます。"
takeaway_title = "ポイント"
takeaway = "チャットも結局は `role` と `turn` を持つ LLM_CALL の列です。firewall がモデルの **手前** にあるので、injection はトークンを消費せず、しかも常に追跡可能。"

[scenario.bench]
title = "ベンチ — 同プロンプトを 3 モデルに、3 軸で判定"
description = "ローカル 1 + クラウド 2 で同じプロンプトを実行し、latency / cost / 品質スコア (LLM-as-judge) で比較。"
intro_title = "シナリオ: 3 軸ベンチマーク"
intro = "**多軸ベンチ**: 同じプロンプトを 3 モデルに投げ、judge が latency / cost / 品質ごとに勝者を選びます。品質は LLM-as-judge が忠実度 + 網羅度で採点。"
prompt_title = "プロンプト"
prompt = "プロンプト: `{q}`"
verdict_title = "判定"
verdict = "**判定** — 最速: `{latency_winner}` ・ 最安 (有償内): `{cost_winner}` ・ 最高品質: `{quality_winner}`。3 軸全勝するモデルは存在しません。"
takeaway_title = "ポイント"
takeaway = "1 軸ベンチは嘘をつく。最安は最速ではなく、最速は最高品質ではない。**間違えた時の事業コスト** が一番大きい軸を選んで意思決定すること。"

[scenario.drift]
title = "ドリフト — 本番モデルの出力分布が週単位でシフト"
description = "応答長平均が week1 → week6 で増加。CUSUM が検知し、LLM が retrieval 老朽化を診断。"
intro_title = "シナリオ: モデルドリフト"
intro = "**出力分布のドリフト**。本番チャットモデル `prod_chat_v1` の応答長は week1 で安定。week4 と week6 で徐々に増加 — プロンプトは未変更ですが、retrieval が変わっています。SPC が捕捉。"
phase_a_title = "フェーズ A — week1 (基準)"
phase_a = "フェーズ A — **基準週**: 平均応答長 ~150 トークン、揺らぎ ±8。"
phase_b_title = "フェーズ B — week4 (緩やかなドリフト)"
phase_b = "フェーズ B — **week4**: ~+25 トークンの緩やかな上方ドリフト。CUSUM が累積開始。"
phase_c_title = "フェーズ C — week6 (アラーム)"
phase_c = "フェーズ C — **week6**: ドリフトが +55 トークンまで加速。CUSUM が閾値突破 → アラーム。"
llm_title = "LLM"
llm = "**LLM**: プロンプトテンプレートは未変更。CUSUM = {cusum}。**retrieval の老朽化** が最も濃厚 — インデックス済みコーパスが拡大し、回答ごとに含むコンテキスト量が増えている。"
takeaway_title = "ポイント"
takeaway = "ドリフトは **モデル本体** の責任であることは稀。再 fine-tune の前にパイプライン (retrieval / prompt / cache) を疑え。"

[scenario.mcp_call]
title = "MCP — ツール呼び出し + タイムアウト + ガバナンス遮断"
description = "MCP ツール 6 span を再生。3 件成功 + タイムアウトとリトライ + シェルパイプをポリシー遮断。"
intro_title = "シナリオ: MCP ツール呼び出し"
intro = "**MCP** = Model Context Protocol。各ツール呼び出しは TRACE_SPAN。`filesystem` / `http` / `shell` サーバ越しに 6 span を再生 — **タイムアウト後リトライで成功** と **`curl … | sh` をガバナンスで遮断** を含みます。"
timeout_title = "タイムアウト"
timeout = "`{tool}` が **タイムアウト** (5 秒応答なし)。呼び出し側は backoff 付きで 1 回リトライ — これは llmesh の信頼性プリミティブ、魔法ではない。"
blocked_title = "ガバナンス遮断"
blocked = "**`{tool}` がガバナンスポリシーで遮断** — `curl … | sh` は典型的な侵入導線。引数プレビュー込みで audit に記録。"
takeaway_title = "ポイント"
takeaway = "MCP ツール呼び出しを RPC と思って、trace・time・**gate** を入れる。`Bash` / `Run` の手前にガバナンス層を置くだけで、最悪の罠の大半を防げる。"

[scenario.reliability]
title = "信頼性プロトコル — ACK / RETRANSMIT / Watchdog"
description = "6 チャンクのストリームを損失下で送信。RETRANSMIT が #3 と #5 を回復し、STREAM_ACK で完了。"
intro_title = "シナリオ: 信頼性プロトコル"
intro = "**信頼性プロトコル**: `ChunkSender` + `MessageAssembler` が ACK + RETRANSMIT でパケット損失から回復 (RETRANSMIT は **1 回のみ** 送信、再送ループ阻止)。"
step1_title = "ステップ 1 — 送信"
step1 = "**ステップ 1.** 送信側がチャンク 1-6 を送出。ネットワークが **#3** と **#5** を破棄。"
step2_title = "ステップ 2 — 検出"
step2 = "**ステップ 2.** 受信側の `MessageAssembler.check_timeouts()` が seq=3 と seq=5 の欠落を検出 → **1 回の** RETRANSMIT 要求を発行。"
step3_title = "ステップ 3 — 復旧"
step3 = "**ステップ 3.** 送信側の `handle_retransmit()` が **欠落分のみ** 再送。重複再試行なし。"
step4_title = "ステップ 4 — ACK"
step4 = "**ステップ 4.** 受信側がメッセージを完成 → `STREAM_ACK` を発行。送信側の `handle_ack()` がバッファを破棄。"
watchdog_title = "おまけ — Watchdog"
watchdog = "もし受信側が無音になった場合、**WatchdogTimer** (NTP 確認済みクロック) が切断を通知し、`expire_old()` がバッファを GC します。"
takeaway_title = "ポイント"
takeaway = "RETRANSMIT は欠落ごとに **1 回のみ** 送り、再送嵐や増幅を防ぎます。TTL でバッファが永遠に膨らむことも防止。"
