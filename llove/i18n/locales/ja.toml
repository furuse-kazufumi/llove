blocked = "ターンが **{layer} 層** で遮断され、モデルに到達しませんでした。audit に記録されており、ユーザは普通に質問し直せます。"
takeaway_title = "ポイント"
takeaway = "チャットも結局は `role` と `turn` を持つ LLM_CALL の列です。firewall がモデルの **手前** にあるので、injection はトークンを消費せず、しかも常に追跡可能。"

[scenario.bench]
title = "ベンチ — 同プロンプトを 3 モデルに、3 軸で判定"
description = "ローカル 1 + クラウド 2 で同じプロンプトを実行し、latency / cost / 品質スコア (LLM-as-judge) で比較。"
intro_title = "シナリオ: 3 軸ベンチマーク"
intro = "**多軸ベンチ**: 同じプロンプトを 3 モデルに投げ、judge が latency / cost / 品質ごとに勝者を選びます。品質は LLM-as-judge が忠実度 + 網羅度で採点。"
prompt_title = "プロンプト"
prompt = "プロンプト: `{q}`"
verdict_title = "判定"
verdict = "**判定** — 最速: `{latency_winner}` ・ 最安 (有償内): `{cost_winner}` ・ 最高品質: `{quality_winner}`。3 軸全勝するモデルは存在しません。"
takeaway_title = "ポイント"
takeaway = "1 軸ベンチは嘘をつく。最安は最速ではなく、最速は最高品質ではない。**間違えた時の事業コスト** が一番大きい軸を選んで意思決定すること。"

[scenario.drift]
title = "ドリフト — 本番モデルの出力分布が週単位でシフト"
description = "応答長平均が week1 → week6 で増加。CUSUM が検知し、LLM が retrieval 老朽化を診断。"
intro_title = "シナリオ: モデルドリフト"
intro = "**出力分布のドリフト**。本番チャットモデル `prod_chat_v1` の応答長は week1 で安定。week4 と week6 で徐々に増加 — プロンプトは未変更ですが、retrieval が変わっています。SPC が捕捉。"
phase_a_title = "フェーズ A — week1 (基準)"
phase_a = "フェーズ A — **基準週**: 平均応答長 ~150 トークン、揺らぎ ±8。"
phase_b_title = "フェーズ B — week4 (緩やかなドリフト)"
phase_b = "フェーズ B — **week4**: ~+25 トークンの緩やかな上方ドリフト。CUSUM が累積開始。"
phase_c_title = "フェーズ C — week6 (アラーム)"
phase_c = "フェーズ C — **week6**: ドリフトが +55 トークンまで加速。CUSUM が閾値突破 → アラーム。"
llm_title = "LLM"
llm = "**LLM**: プロンプトテンプレートは未変更。CUSUM = {cusum}。**retrieval の老朽化** が最も濃厚 — インデックス済みコーパスが拡大し、回答ごとに含むコンテキスト量が増えている。"
takeaway_title = "ポイント"
takeaway = "ドリフトは **モデル本体** の責任であることは稀。再 fine-tune の前にパイプライン (retrieval / prompt / cache) を疑え。"

[scenario.mcp_call]
title = "MCP — ツール呼び出し + タイムアウト + ガバナンス遮断"
description = "MCP ツール 6 span を再生。3 件成功 + タイムアウトとリトライ + シェルパイプをポリシー遮断。"
intro_title = "シナリオ: MCP ツール呼び出し"
intro = "**MCP** = Model Context Protocol。各ツール呼び出しは TRACE_SPAN。`filesystem` / `http` / `shell` サーバ越しに 6 span を再生 — **タイムアウト後リトライで成功** と **`curl … | sh` をガバナンスで遮断** を含みます。"
timeout_title = "タイムアウト"
timeout = "`{tool}` が **タイムアウト** (5 秒応答なし)。呼び出し側は backoff 付きで 1 回リトライ — これは llmesh の信頼性プリミティブ、魔法ではない。"
blocked_title = "ガバナンス遮断"
blocked = "**`{tool}` がガバナンスポリシーで遮断** — `curl … | sh` は典型的な侵入導線。引数プレビュー込みで audit に記録。"
takeaway_title = "ポイント"
takeaway = "MCP ツール呼び出しを RPC と思って、trace・time・**gate** を入れる。`Bash` / `Run` の手前にガバナンス層を置くだけで、最悪の罠の大半を防げる。"

[scenario.vision]
title = "ビジョン — VLM がベルトコンベア画像から不良品を検出"
description = "ベルトコンベア 7 フレームを ASCII art で再生。VLM がキャプションを付与し、不良スコアが 0.5 を超えたフレームで SPC アラーム。"
intro_title = "シナリオ: ビジョン (VLM)"
intro = "**VLM による不良品検査。** フレームは ASCII で描画 — どんなターミナルでも動きます。同じ payload に `image_b64` も載せているので、別途 Qt ビューア (`tools/qt_viewer/vision_viewer.py`) で写真として再生可能。途中 2 フレームが不良判定される様子を観察。"
takeaway_title = "ポイント"
takeaway = "**{defects}/{total} フレーム** で不良検出。VLM のキャプションは bbox だけでなく **不良クラス** (surface_contamination) まで指定 — それがそのまま audit に残る。同じ payload を Qt ビューアに流せばリッチなレビューも可能。"

[scenario.pointcloud]
title = "点群 — LiDAR が部品トレイの欠品スロットを検知"
description = "4×3 部品トレイの LiDAR 4 スキャン (ASCII top-view)。右上スロットが空になり、密度低下で SPC アラーム。"
intro_title = "シナリオ: 点群 (LiDAR)"
intro = "**4×3 部品トレイの LiDAR top-view。** 各スキャンは 24×7 の ASCII で描画、生の `points_xyz` も payload に載せます — `tools/qt_viewer/pointcloud_viewer.py` に流せば 3D で回転表示。スロットが 2 スキャン連続で空になる様子を観察。"
takeaway_title = "ポイント"
takeaway = "**{alarms} スキャンでアラーム発火**。TUI は密度でシルエットを示し、同じ Event に XYZ が乗るので外部ツールでもリッチに視覚化可能。audit サマリは **どのスロット (col, row)** かまで特定。"

[scenario.mindmap]
title = "マインドマップ — LLM がクエリを知識ツリーに展開"
description = "「LLMesh とは？」を BFS 展開 — 18 ノード × 5 分岐。breadth が 12 を超えると SPC アラーム (探索が広がりすぎ)。"
intro_title = "シナリオ: マインドマップ"
intro = "**マインドマップのライブ構築。** LLM がシードクエリから関連概念を BFS で展開します。各ノードは TRACE_SPAN、ツリーの breadth で SPC アラーム — \"暴走的な探索\" を検出。最終ツリーは ASCII outline で上から読めるよう描画。"
query_title = "シードクエリ"
query = "**シード**: *LLMesh とは何で、どんな機能があるか？*  ルートノード: `LLMesh`。"
alarm_title = "Breadth アラーム"
alarm = "ツリー breadth = **{breadth}** が閾値 {threshold} を超過。クエリが多方向に分岐しすぎ — 本番ではプロンプトを絞るかサブクエリに分割するタイミング。"
takeaway_title = "ポイント"
takeaway = "**{breadth} ノード** を 1 回の展開で生成。マインドマップ = 特殊データではなく **TRACE_SPAN のツリー**。breadth に SPC をかけることで \"広すぎプロンプト\" を回答が脱線する前に検出。最終 audit Event に隣接情報も載るので別ツールでも好きに描画可能。"

[scenario.coin_toss]
title = "コイン投げ — 表の比率が 1/2 に収束 (学生向け)"
sensor_pane_title = "🪙 投擲結果  · 📖 読み取り専用"
description = "公平なコインを {n} 回投げ、表の比率が 0.50 へ近づく様子を観察。8 回以降に大きく外れた場合だけ SPC アラーム。LLMesh の知識ゼロで OK — 4 ペインの入門デモ。"
intro_title = "シナリオ: コイン投げ"
intro = "**コインを {n} 回投げます。** 1 回ごとに SensorStream (表の累積比率)、Audit log (各回の結果) に流れます。序盤に偏りが大きいと SPC アラームも発火。比率が **0.50** に近づく **大数の法則** を目視で体験。"
alarm_title = "怪しいストリーク"
alarm = "{n} 回時点で **表 {heads} 回 / 裏 {tails} 回** (比率 = **{ratio}**)。0.50 から大きく外れています — 序盤の運か、それとも歪んだコインか？ もう少し観察してみましょう。"
takeaway_title = "ポイント"
takeaway = "**表 {heads} / 裏 {tails}** — 最終比率 **{ratio}**。**大数の法則** の勝利: 試行回数が増えれば、公平なコインは必ず 0.50 付近に落ち着く。早めの SPC アラームは「本当に怪しいのか、ただの運か」を判定する助けになります。"

[scenario.shogi]
title = "将棋 — 2 つの LLM が 14 手の序盤を再生 (MVP1、scripted)"
description = "MVP1: 共通 9x9 盤面に scripted な序盤を再生。各手で評価値を SPC ペインに、大きな評価値変動で alarm。MVP2 では scripted を実 LLM 呼び出しに置き換える予定。"
intro_title = "シナリオ: 将棋 (MVP1)"
intro = "**2 LLM 将棋 (MVP1)。** 対局者: ☗ 先手 = **{sente}**　vs　☖ 後手 = **{gote}**。実 LLM はまだ繋いでいません — 14 手の序盤を再生し、4 ペインに局面が流れる様子を確認します。盤面 → *盤面* ペイン、評価値 → *評価* ペイン、各手は USI で *棋譜* ペインに、LLM 風解説は *解説* ペインに。"
sensor_pane_title = "♟ 盤面 (各手の局面)  · 📖 読み取り専用"
spc_pane_title = "📊 評価 — 先手リード (正の値)  · 📖 読み取り専用"
audit_pane_title = "📋 棋譜 — ▲先手 △後手  · 📖 読み取り専用"
narration_pane_title = "💬 解説 — LLM の思考  · 📖 読み取り専用"
takeaway_title = "ポイント"
takeaway = "**{plies} 半手で終了、最終評価値 = {final_eval:+d}**。これは **MVP1 — 序盤の再生のみ** で、投了したわけではなくここで打ち切っています。MVP2 で scripted を実 LLM に置き換え (合法手チェック付き) → 本物の終局まで指せるようになる予定です。"

[scenario.reliability]
title = "信頼性プロトコル — ACK / RETRANSMIT / Watchdog"
description = "6 チャンクのストリームを損失下で送信。RETRANSMIT が #3 と #5 を回復し、STREAM_ACK で完了。"
intro_title = "シナリオ: 信頼性プロトコル"
intro = "**信頼性プロトコル**: `ChunkSender` + `MessageAssembler` が ACK + RETRANSMIT でパケット損失から回復 (RETRANSMIT は **1 回のみ** 送信、再送ループ阻止)。"
step1_title = "ステップ 1 — 送信"
step1 = "**ステップ 1.** 送信側がチャンク 1-6 を送出。ネットワークが **#3** と **#5** を破棄。"
step2_title = "ステップ 2 — 検出"
step2 = "**ステップ 2.** 受信側の `MessageAssembler.check_timeouts()` が seq=3 と seq=5 の欠落を検出 → **1 回の** RETRANSMIT 要求を発行。"
step3_title = "ステップ 3 — 復旧"
step3 = "**ステップ 3.** 送信側の `handle_retransmit()` が **欠落分のみ** 再送。重複再試行なし。"
step4_title = "ステップ 4 — ACK"
step4 = "**ステップ 4.** 受信側がメッセージを完成 → `STREAM_ACK` を発行。送信側の `handle_ack()` がバッファを破棄。"
watchdog_title = "おまけ — Watchdog"
watchdog = "もし受信側が無音になった場合、**WatchdogTimer** (NTP 確認済みクロック) が切断を通知し、`expire_old()` がバッファを GC します。"
takeaway_title = "ポイント"
takeaway = "RETRANSMIT は欠落ごとに **1 回のみ** 送り、再送嵐や増幅を防ぎます。TTL でバッファが永遠に膨らむことも防止。"
