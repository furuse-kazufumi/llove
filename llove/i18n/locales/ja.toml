[scenario.audit]
title = "監査 — HMAC チェーンによる改ざん検知"
description = "監査エントリを追加 → 1 件改ざん → verify_chain() が破断を検知する流れを再生。"
intro_title = "シナリオ: 監査チェーン"
intro = "**AuditTrail** はすべてのエントリの HMAC を次のエントリに連鎖させます。1 件でも削除/変更されればチェーンが破断し、`verify_chain()` が例外を投げます。"
step1_title = "ステップ 1"
step1 = "**ステップ 1.** 5 件のエントリを追加 — 各エントリには前のエントリの HMAC が `prev_hmac` として連鎖されます"
step2_title = "ステップ 2 — 改ざん"
step2 = "**ステップ 2.** 攻撃者がエントリ **#3** を書き換える。保存されている HMAC が、#4 が連鎖していた `prev_hmac` と整合しなくなる。"
step3_title = "ステップ 3 — 検証"
step3 = "**ステップ 3.** 運用者が `verify_chain()` を実行 — #4 の `prev_hmac` が #3 を再計算した HMAC と一致しない → **seq=3 でチェーン破断**"
takeaway_title = "ポイント"
takeaway = "改ざん**耐性**ではなく改ざん**検知**。攻撃者は履歴を黙って書き換えられず、破断点が法的証拠になります。"

