[scenario.multimodal]
title = "Multimodal SPC — sensor + VLM caption fused"
description = "Two streams (vibration + camera caption) flow side-by-side. UnifiedSPC's AND rule fires only when both indicate trouble."
intro_title = "Scenario: Multimodal SPC"
intro = "**UnifiedSPC** combines two streams (numerical sensor + image caption) with a configurable AND / OR / Weighted rule. We use AND here: alarm only when **both** streams cross their limits."
phase_a_title = "Phase A"
phase_a = "Phase A — sensor nominal, image nominal → **no alarm** (AND not satisfied)"
phase_b_title = "Phase B"
phase_b = "Phase B — image suspicious, sensor still fine → AND rule **suppresses** alarm"
phase_c_title = "Phase C"
phase_c = "Phase C — vibration also rises **and** image still suspicious → **alarm**: both streams agree"
takeaway_title = "Take-away"
takeaway = "UnifiedSPC reduces false alarms by **requiring agreement across modalities**. Choose AND for high-precision (process control), OR for high-recall (safety)."

[scenario.rag]
title = "RAG — three vector stores compared"
description = "Replay one query across NumpyVectorStore / SqliteVectorStore / LSHVectorStore and compare latency vs recall."
intro_title = "Scenario: RAG stores"
intro = "**llmesh.rag** ships 3 stores. Same `Retriever` ABC, different scaling. We replay the same query against each one."
query_title = "Query"
query = "query: `{q}`"
running = "running **{name}** ({scale}) — {note}"
takeaway_title = "Take-away"
takeaway = "**Pick by scale, not popularity.** Numpy for prototypes, SQLite for typical production (≤ 10⁶), LSH ANN when you blow past a million documents."

