prompt_title = "Prompt"
prompt = "prompt: `{q}`"
calling = "calling **{backend}** — model `{model}` …"
result_title = "{backend} answered"
result = "**{backend}** · `{model}` → {latency_ms} ms · tokens: {tokens} · cost: {cost}\n\n{answer}"
failed_title = "{backend} unavailable"
failed = "**{backend}** failed — {reason}. Skipping this backend and moving on."
none_configured_title = "No backend configured"
none_configured = "No LLM backend is configured. Set ANTHROPIC_API_KEY or start a local ollama (`ollama serve`), then rerun this scenario."
