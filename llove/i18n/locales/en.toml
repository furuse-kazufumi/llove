# llove — English locale (default / fallback)
#
# Every other locale is checked against this file: keys present here MUST
# also appear in ja.toml etc. Missing keys silently fall back to English.

[ui]
title = "💗 llove"
subtitle = "Made with llove — Watch your LLMesh with llove"
hint_bar = "[bold]↑ buttons[/bold] = clickable controls   ·   [bold]↓ panes[/bold] = read-only data displays   ·   key shortcuts: q quit · r reset · space pause · h help"

[ui.identity]
# Friendly nudge when the host has no llmesh identity yet — llove is, after
# all, a TUI window onto llmesh, so an unidentified run is the perfect place
# to mention how to get one.
missing = "🔑 no llmesh identity on this host — install [bold]pip install llmesh-mcp[/bold] to give every llove run a verifiable did:key"

[ui.button]
pause = "⏸ Pause"
resume = "▶ Resume"
reset = "⟲ Reset"
help = "? Help"
quit = "✕ Quit"

[ui.choice]
# Audit line recorded when the user picks an option at an interactive
# choice-point (so a --log JSONL replays the exact path taken).
audit = "decision: {label}"

[ui.help]
title = "[bold]💗 llove — Help[/bold]\n[bold yellow]Press ESC (or h / q / the Close button) to return.[/bold yellow]\n"
body = """
[bold]Mouse / clickable controls (top row)[/bold]
  ⏸ Pause / ▶ Resume   pause or resume the data stream
  ⟲ Reset              clear the rolling rows in every pane
  ? Help               open this help (you're here)
  ✕ Quit               exit llove

[bold]Keyboard shortcuts[/bold]
  q       quit
  r       reset views
  space   pause / resume
  h       open / close this help
  esc     close this help

[bold]Panes (read-only)[/bold]
  📡 SensorEvent stream — rolling sensor readings + 40-pt sparkline
  📊 SPC chart           — CUSUM control status + recent alarm log
  📋 Audit log           — audit / LLM call / RAG hit events, newest first
  💬 Narration           — scenario commentary (when running --scenario)

[bold]Tip[/bold]
  Footer entries (q Quit, r Reset, ...) are also clickable.
"""
close = "Close (esc)"

[ui.pane.sensor_stream]
title = "📡 SensorEvent stream  · 📖 read-only"
subtitle_init = "(waiting for data)"
subtitle_active = "{count} pts | latest {latest}"
header = "time      metric                value"
sparkline_label = "sparkline (last 40):"
empty = "(no data yet)"

[ui.pane.spc_chart]
title = "📊 SPC chart — CUSUM control  · 📖 read-only"
subtitle_init = "watching for drift"
subtitle_alarmed = "⚠ {count} alarm(s)"
status_alarm = "[bold red]●[/bold red] status: ALARM"
status_nominal = "[bold green]●[/bold green] status: nominal  (value={value})"
status_waiting = "[dim]●[/dim] status: waiting for data"
recent_alarms = "  Recent alarms:"
no_alarms = "  (no alarms)"
as_of = "[dim]as of {ts}[/dim]"

[ui.pane.audit_log]
title = "📋 Audit log — audit / LLM / RAG events  · 📖 read-only"
subtitle_init = "newest first"
empty = "(no audit events yet)"

[ui.pane.narration]
title = "💬 Narration — what's happening, in plain words  · 📖 read-only"
subtitle_init = "(scenario commentary)"
subtitle_active = "beat {beat} · {latest}"
empty = "[dim](no narration yet — waiting for the scenario to begin)[/dim]"

[ui.pane.markdown]
title = "📝 Markdown — full GFM rendering  · 📖 read-only"
empty = "_(no markdown yet)_"

[scenario.firewall]
title = "Firewall — 4-layer prompt screening"
description = "Replay 12 prompts and watch L0/L1/L1.5/L2 layers route them to ALLOW / BLOCK / SUMMARIZE."
intro_title = "Scenario: PromptFirewall 4 layers"
intro = "**LLMesh PromptFirewall** has 4 layers running in priority order. Watch each prompt below and note which layer catches it — earlier layers always win."
takeaway_title = "Take-away"
takeaway = "**Layer order matters.** L0 catches injection patterns first, then secrets, then PII, then structure. Earlier layers shadow later ones — that's by design."
prompt_line = "prompt: `{shown}`\n  → **{layer}** → **{action}** ({reason})"

