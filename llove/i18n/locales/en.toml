intro = "**VLM-based defect inspection.** Frames are rendered in ASCII so the scenario works on any terminal — the same payload also carries `image_b64` for the optional Qt viewer (`tools/qt_viewer/vision_viewer.py`). Watch a couple of frames flag as defective."
takeaway_title = "Take-away"
takeaway = "**{defects}/{total}** frames flagged. The VLM caption identifies the *defect class* (surface_contamination), not just the bbox — that becomes the audit entry. Same payload feeds a Qt viewer for richer review."

[scenario.pointcloud]
title = "Point cloud — LiDAR detects a missing slot in a parts tray"
description = "4 LiDAR scans of a 4×3 parts tray (top-view ASCII). When the top-right slot empties, density drops and SPC fires."
intro_title = "Scenario: Point cloud (LiDAR)"
intro = "**LiDAR top-view of a 4×3 parts tray.** Each scan is rendered as ASCII (24×7), and the raw `points_xyz` list also rides on the payload — feed it to `tools/qt_viewer/pointcloud_viewer.py` for a 3D rotatable view. Watch a slot go missing across two scans."
takeaway_title = "Take-away"
takeaway = "**{alarms} scans alarmed.** TUI shows the silhouette via density; the same Event carries XYZ for richer downstream tools. The audit summary nails *which slot* (column, row) is empty."

[scenario.mindmap]
title = "Mindmap — LLM expands a query into a knowledge tree"
description = "Watch a BFS expansion of \"What is LLMesh?\" — 18 nodes across 5 branches. SPC fires when breadth crosses 12 (proxy for \"too broad\")."
intro_title = "Scenario: Mindmap"
intro = "**Live mindmap construction.** An LLM starts from a seed query and BFS-expands related concepts. Each node is a TRACE_SPAN; breadth drives an SPC alarm so we can detect \"runaway\" exploration. The final tree renders as an ASCII outline you can read top-to-bottom."
query_title = "Seed query"
query = "**Seed**: *What is LLMesh and what are its main capabilities?*  Root node: `LLMesh`."
alarm_title = "Breadth alarm"
alarm = "Tree breadth = **{breadth}** crossed the threshold of {threshold}. The query is exploring too many directions; in production you'd narrow the prompt or split into sub-queries."
takeaway_title = "Take-away"
takeaway = "**{breadth} nodes** in one expansion. Mindmap = a TRACE_SPAN tree, not a special data type. SPC on breadth catches \"too broad\" prompts before they drown the answer in tangents. The same adjacency rides on the final audit Event for downstream tools to render their own way."

[scenario.coin_toss]
title = "Coin toss — heads ratio settles near 1/2 (student-friendly)"
sensor_pane_title = "🪙 Toss outcomes  · 📖 read-only"
description = "Toss a fair coin {n} times and watch the heads ratio drift toward 0.50. SPC fires only if it strays far from 1/2 after 8+ tosses. No LLMesh knowledge required — just a friendly intro to the four panes."
intro_title = "Scenario: Coin toss"
intro = "**Toss a coin {n} times.** Each toss feeds the SensorStream (running heads ratio), the Audit log (every result), and — if early luck looks suspicious — the SPC alarm. Watch the ratio creep toward **0.50** (Law of Large Numbers in action)."
alarm_title = "Suspicious streak"
alarm = "After **{n}** tosses we have **{heads} heads / {tails} tails** (ratio = **{ratio}**). That's far from 0.50 — interesting! Could be early luck, could be a loaded coin. Keep watching."
takeaway_title = "Take-away"
takeaway = "**{heads} heads, {tails} tails** — final ratio **{ratio}**. The Law of Large Numbers wins: enough tosses, and a fair coin always hovers near 0.50. SPC alarms early help us spot whether the deviation is just bad luck or something to investigate."

[scenario.shogi]
title = "Shogi — two LLMs replay a 14-move opening (MVP1, scripted)"
description = "MVP1: scripted opening on a shared 9x9 board. Each ply lands an eval score in the SPC pane; large eval swings raise an alarm. MVP2 will swap the script for real LLM calls."
intro_title = "Scenario: Shogi (MVP1)"
intro = "**Two-LLM Shogi (MVP1).** Players: ☗ sente = **{sente}** vs ☖ gote = **{gote}**. No real LLM yet — we replay a 14-half-move opening so you can see how the four panes carry the game state. The board lives in the *Board* pane; eval drifts in the *Eval* pane; every move is logged as USI in *Moves*; LLM-style commentary lands in *Commentary*."
sensor_pane_title = "♟ Board (every ply)  · 📖 read-only"
spc_pane_title = "📊 Eval — sente lead (positive)  · 📖 read-only"
audit_pane_title = "📋 棋譜 (kifu) — ▲ sente △ gote  · 📖 read-only"
narration_pane_title = "💬 Commentary — LLM thinking  · 📖 read-only"
takeaway_title = "Take-away"
takeaway = "**{plies} half-moves played, final eval = {final_eval:+d}**.  This is **MVP1 — opening replay only**; the game is intentionally truncated here, not resigned. MVP2 swaps the script for live LLM play (with a legality checker) so the pieces actually fight to a finish."

[scenario.reliability]
title = "Reliability — ACK / RETRANSMIT / Watchdog"
description = "Lossy stream of 6 chunks. Watch RETRANSMIT recover dropped chunks 3 and 5 before STREAM_ACK arrives."
intro_title = "Scenario: Reliability"
intro = "**Reliability protocol**: `ChunkSender` + `MessageAssembler` recover from packet loss with ACK + RETRANSMIT (sent at most **once** to avoid amplification)."
step1_title = "Step 1 — send"
step1 = "**Step 1.** Sender pushes chunks 1-6. The network drops **#3** and **#5**."
step2_title = "Step 2 — detect"
step2 = "**Step 2.** Receiver's `MessageAssembler.check_timeouts()` notices gaps at seq=3 and seq=5 → emits **one** RETRANSMIT request."
step3_title = "Step 3 — recover"
step3 = "**Step 3.** Sender's `handle_retransmit()` re-sends **only** the missing chunks. No duplicate retries."
step4_title = "Step 4 — ack"
step4 = "**Step 4.** Receiver completes the message → emits `STREAM_ACK`. Sender's `handle_ack()` drops its buffer."
watchdog_title = "Bonus — watchdog"
watchdog = "If the receiver had gone silent, **WatchdogTimer** (NTP-checked clock) would have signalled a disconnect; `expire_old()` would have GC'd buffered chunks."
takeaway_title = "Take-away"
takeaway = "RETRANSMIT is sent **once** per gap to avoid retry storms / amplification. TTL guarantees buffers don't grow forever even on disconnect."
