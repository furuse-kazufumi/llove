# llove — English locale (default / fallback)
#
# Every other locale is checked against this file: keys present here MUST
# also appear in ja.toml etc. Missing keys silently fall back to English.

[ui]
title = "💗 llove"
subtitle = "Made with llove — Watch your LLMesh with llove"
hint_bar = "[bold]↑ buttons[/bold] = clickable controls   ·   [bold]↓ panes[/bold] = read-only data displays   ·   key shortcuts: q quit · r reset · space pause · h help"

[ui.button]
pause = "⏸ Pause"
resume = "▶ Resume"
reset = "⟲ Reset"
help = "? Help"
quit = "✕ Quit"

[ui.help]
title = "[bold]💗 llove — Help[/bold]\n[bold yellow]Press ESC (or h / q / the Close button) to return.[/bold yellow]\n"
body = """
[bold]Mouse / clickable controls (top row)[/bold]
  ⏸ Pause / ▶ Resume   pause or resume the data stream
  ⟲ Reset              clear the rolling rows in every pane
  ? Help               open this help (you're here)
  ✕ Quit               exit llove

[bold]Keyboard shortcuts[/bold]
  q       quit
  r       reset views
  space   pause / resume
  h       open / close this help
  esc     close this help

[bold]Panes (read-only)[/bold]
  📡 SensorEvent stream — rolling sensor readings + 40-pt sparkline
  📊 SPC chart           — CUSUM control status + recent alarm log
  📋 Audit log           — audit / LLM call / RAG hit events, newest first
  💬 Narration           — scenario commentary (when running --scenario)

[bold]Tip[/bold]
  Footer entries (q Quit, r Reset, ...) are also clickable.
"""
close = "Close (esc)"

[ui.pane.sensor_stream]
title = "📡 SensorEvent stream  · 📖 read-only"
subtitle_init = "(waiting for data)"
subtitle_active = "{count} pts | latest {latest}"
header = "time      sensor                value"
sparkline_label = "sparkline (last 40):"
empty = "(no data yet)"

[ui.pane.spc_chart]
title = "📊 SPC chart — CUSUM control  · 📖 read-only"
subtitle_init = "watching for drift"
subtitle_alarmed = "⚠ {count} alarm(s)"
status_alarm = "[bold red]●[/bold red] status: ALARM"
status_nominal = "[bold green]●[/bold green] status: nominal  (value={value})"
status_waiting = "[dim]●[/dim] status: waiting for data"
recent_alarms = "  Recent alarms:"
no_alarms = "  (no alarms)"
as_of = "[dim]as of {ts}[/dim]"

[ui.pane.audit_log]
title = "📋 Audit log — audit / LLM / RAG events  · 📖 read-only"
subtitle_init = "newest first"
empty = "(no audit events yet)"

[ui.pane.narration]
title = "💬 Narration — what's happening, in plain words  · 📖 read-only"
subtitle_init = "(scenario commentary)"
subtitle_active = "beat {beat} · {latest}"
empty = "[dim](no narration yet — waiting for the scenario to begin)[/dim]"

[scenario.firewall]
title = "Firewall — 4-layer prompt screening"
description = "Replay 12 prompts and watch L0/L1/L1.5/L2 layers route them to ALLOW / BLOCK / SUMMARIZE."
intro_title = "Scenario: PromptFirewall 4 layers"
intro = "**LLMesh PromptFirewall** has 4 layers running in priority order. Watch each prompt below and note which layer catches it — earlier layers always win."
takeaway_title = "Take-away"
takeaway = "**Layer order matters.** L0 catches injection patterns first, then secrets, then PII, then structure. Earlier layers shadow later ones — that's by design."
prompt_line = "prompt: `{shown}`\n  → **{layer}** → **{action}** ({reason})"

[scenario.scada]
title = "SCADA — ExplainedCUSUM with LLM hypothesis"
description = "A bearing temperature sensor drifts past its control limit. ExplainedCUSUM detects the alarm and the LLM emits a hypothesis."
intro_title = "Scenario: SCADA"
intro = "**SCADA + ExplainedCUSUM**: a bearing temperature sensor will drift past its control limit. CUSUM detects the cumulative shift; the LLM explainer then attaches a likely cause."
phase1_title = "Phase 1"
phase1 = "Phase 1 — **normal**: temperature hovers around 70 °C"
phase2_title = "Phase 2"
phase2 = "Phase 2 — **drift**: viscosity drops in `lubricant_flow_03`, bearing temperature rises"
phase3_title = "Phase 3"
phase3 = "Phase 3 — **recovery** after maintenance action"
llm_title = "LLM"
llm_triggered = "**LLM explainer** triggered — building incident report"
hypothesis = "The cumulative drift began ~12 minutes ago, coinciding with a viscosity drop in lubricant_flow_03. Bearing wear or lubricant degradation is plausible. Recommend checking lubricant pressure and vibration spectrum."
takeaway_title = "Take-away"
takeaway = "ExplainedCUSUM = **CUSUMChart + LLMExplainer** glued together. Alarms fire on numerical drift; the LLM attaches a natural-language cause."

[scenario.multimodal]
title = "Multimodal SPC — sensor + VLM caption fused"
description = "Two streams (vibration + camera caption) flow side-by-side. UnifiedSPC's AND rule fires only when both indicate trouble."
intro_title = "Scenario: Multimodal SPC"
intro = "**UnifiedSPC** combines two streams (numerical sensor + image caption) with a configurable AND / OR / Weighted rule. We use AND here: alarm only when **both** streams cross their limits."
phase_a_title = "Phase A"
phase_a = "Phase A — sensor nominal, image nominal → **no alarm** (AND not satisfied)"
phase_b_title = "Phase B"
phase_b = "Phase B — image suspicious, sensor still fine → AND rule **suppresses** alarm"
phase_c_title = "Phase C"
phase_c = "Phase C — vibration also rises **and** image still suspicious → **alarm**: both streams agree"
takeaway_title = "Take-away"
takeaway = "UnifiedSPC reduces false alarms by **requiring agreement across modalities**. Choose AND for high-precision (process control), OR for high-recall (safety)."

[scenario.rag]
title = "RAG — three vector stores compared"
description = "Replay one query across NumpyVectorStore / SqliteVectorStore / LSHVectorStore and compare latency vs recall."
intro_title = "Scenario: RAG stores"
intro = "**llmesh.rag** ships 3 stores. Same `Retriever` ABC, different scaling. We replay the same query against each one."
query_title = "Query"
query = "query: `{q}`"
running = "running **{name}** ({scale}) — {note}"
takeaway_title = "Take-away"
takeaway = "**Pick by scale, not popularity.** Numpy for prototypes, SQLite for typical production (≤ 10⁶), LSH ANN when you blow past a million documents."

[scenario.backends]
title = "LLM backends — Ollama / OpenAI / Anthropic"
description = "Same prompt across local + 2 cloud backends. Compare tokens / latency / cost with the unified ABC."
intro_title = "Scenario: LLM backends"
intro = "**llmesh.llm** lets you swap backends with one constructor change. Same prompt → 3 different backends, no other code changes."
prompt_title = "Prompt"
prompt = "prompt: `{q}`"
calling = "calling **{backend}** — model `{model}`  ({note})"
takeaway_title = "Take-away"
takeaway = "local total = {local_ms} ms (free) · cloud total = {cloud_ms} ms (low cost). **Use local for dev, cloud for hard prompts.**"

[scenario.audit]
title = "Audit — HMAC chain tamper detection"
description = "Append a few audit entries, then tamper with one and watch verify_chain() raise on the broken link."
intro_title = "Scenario: Audit chain"
intro = "**AuditTrail** chains every entry's HMAC into the next. Removing or modifying any entry breaks the chain — `verify_chain()` raises."
step1_title = "Step 1"
step1 = "**Step 1.** Append 5 entries — each gets `prev_hmac` chained from the last"
step2_title = "Step 2 — tamper"
step2 = "**Step 2.** An attacker rewrites entry **#3** in-place. The stored HMAC is now stale relative to the chained `prev_hmac` of #4."
step3_title = "Step 3 — verify"
step3 = "**Step 3.** Operator runs `verify_chain()` — entry #4's `prev_hmac` no longer matches recomputed HMAC of #3 → **chain broken at seq=3**"
takeaway_title = "Take-away"
takeaway = "Tamper-evident, not tamper-proof. The attacker cannot silently rewrite history; the broken link is forensic evidence."

[scenario.cost]
title = "Cost — token spend hits the daily budget"
description = "Replay 7 LLM calls; running cost crosses the daily USD budget and an SPC alarm fires."
intro_title = "Scenario: Cost budget"
intro = "**Token spend matters.** This scenario replays 7 LLM calls — local + cheap cloud + a few large `gpt-4o` runs. Daily budget is **{budget}**; we watch the running total cross it and an SPC alarm fire."
breached_title = "Budget breached"
breached = "After call **#{n}** the running total reached **{total}** and crossed the daily budget. SPC alarm fired on `daily_cost_usd`."
llm_explain_title = "LLM root-cause"
llm_explain = "**LLM explainer**: the 3 large `gpt-4o` calls account for ~95% of today's spend. Earlier `gpt-4o-mini` and local `llama3.2` calls were under budget on their own."
takeaway_title = "Take-away"
takeaway = "Total spend = **{total}** for one session. **Route long prompts to cheaper models** (haiku, mini, local) and gate `gpt-4o` behind a quality requirement — not the default."

[scenario.chat]
title = "Chat — live LLM dialogue with a firewall block"
description = "Replay a 9-turn user/assistant conversation; one prompt-injection turn is blocked by L0 mid-stream."
intro_title = "Scenario: Chat stream"
intro = "**Live chat**: user/assistant turns flow through the LLM call pane. Mid-conversation, an injection prompt is intercepted by the firewall and recorded in audit — the rest of the conversation continues."
blocked_title = "Firewall block"
blocked = "Turn intercepted by **layer {layer}** before reaching the model. Logged to audit; the user can simply re-ask."
takeaway_title = "Take-away"
takeaway = "Chat is just LLM_CALL events with `role` and `turn`. The firewall sits **in front of** the model, so an injection attempt never costs tokens — and is always auditable."

[scenario.bench]
title = "Bench — same prompt, 3 models, 3-axis verdict"
description = "Replay the same prompt across local + 2 cloud models and judge by latency / cost / LLM-as-judge quality."
intro_title = "Scenario: 3-axis benchmark"
intro = "**Multi-axis bench**: same prompt → 3 models → judge picks a winner per axis (latency, cost, quality). Quality is rated by LLM-as-judge on faithfulness + completeness."
prompt_title = "Prompt"
prompt = "prompt: `{q}`"
verdict_title = "Verdict"
verdict = "**Verdict** — fastest: `{latency_winner}` · cheapest paid: `{cost_winner}` · best quality: `{quality_winner}`. No model wins all three."
takeaway_title = "Take-away"
takeaway = "Single-axis benchmarks lie. Cheapest is rarely fastest, fastest is rarely highest-quality. Pick the axis that matches the **business cost of being wrong** for this query."

[scenario.drift]
title = "Drift — production model output shifts over weeks"
description = "Average response length creeps up week 1 → week 6; CUSUM detects the drift and the LLM diagnoses retrieval staleness."
intro_title = "Scenario: Model drift"
intro = "**Output distribution drift**. Production chat model `prod_chat_v1` had stable response lengths in week 1. Weeks 4 and 6 show creeping growth — the prompt didn't change, but retrieval did. SPC catches it."
phase_a_title = "Phase A — week 1 (baseline)"
phase_a = "Phase A — **baseline week**: avg response length ~150 tokens, jitter ±8."
phase_b_title = "Phase B — week 4 (slow drift)"
phase_b = "Phase B — **week 4**: a slow upward drift of ~+25 tokens. CUSUM accumulates."
phase_c_title = "Phase C — week 6 (alarm)"
phase_c = "Phase C — **week 6**: drift accelerates to +55 tokens. CUSUM crosses the threshold → alarm."
llm_title = "LLM"
llm = "**LLM**: the prompt template hasn't changed. CUSUM = {cusum}. Likely root cause is **retrieval staleness** — the indexed corpus is now larger and the model is including more context per answer."
takeaway_title = "Take-away"
takeaway = "Drift is rarely the **model**'s fault. Watch the surrounding pipeline (retrieval, prompts, cache) before re-fine-tuning."

[scenario.mcp_call]
title = "MCP — tool calls + a timeout + a governance block"
description = "Six MCP tool spans: 3 fast successes, one timeout-then-recover, and one shell call blocked by policy."
intro_title = "Scenario: MCP tool calls"
intro = "**MCP** = Model Context Protocol. Each tool call is a TRACE_SPAN. We replay 6 spans across `filesystem`, `http`, and `shell` servers — including a **timeout** that recovers on retry and a **governance block** on a shell pipe-to-interpreter."
timeout_title = "Timeout"
timeout = "**Timeout** on `{tool}` (>5 s, no response). Caller will retry once with backoff — that's a llmesh reliability primitive, not magic."
blocked_title = "Governance block"
blocked = "**`{tool}` blocked** by governance policy — `curl … | sh` is a known foothold pattern. Audit entry recorded with full args preview."
takeaway_title = "Take-away"
takeaway = "Treat MCP tool calls like any other RPC: trace, time, and **gate**. A governance layer in front of `Bash`/`Run` saves you from the worst foot-guns."

[scenario.vision]
title = "Vision — VLM inspects belt-conveyor frames for defects"
description = "Replay 7 belt-conveyor frames as ASCII art. A VLM tags each frame and an SPC alarm fires when defect score crosses 0.5."
intro_title = "Scenario: Vision (VLM)"
intro = "**VLM-based defect inspection.** Frames are rendered in ASCII so the scenario works on any terminal — the same payload also carries `image_b64` for the optional Qt viewer (`tools/qt_viewer/vision_viewer.py`). Watch a couple of frames flag as defective."
takeaway_title = "Take-away"
takeaway = "**{defects}/{total}** frames flagged. The VLM caption identifies the *defect class* (surface_contamination), not just the bbox — that becomes the audit entry. Same payload feeds a Qt viewer for richer review."

[scenario.pointcloud]
title = "Point cloud — LiDAR detects a missing slot in a parts tray"
description = "4 LiDAR scans of a 4×3 parts tray (top-view ASCII). When the top-right slot empties, density drops and SPC fires."
intro_title = "Scenario: Point cloud (LiDAR)"
intro = "**LiDAR top-view of a 4×3 parts tray.** Each scan is rendered as ASCII (24×7), and the raw `points_xyz` list also rides on the payload — feed it to `tools/qt_viewer/pointcloud_viewer.py` for a 3D rotatable view. Watch a slot go missing across two scans."
takeaway_title = "Take-away"
takeaway = "**{alarms} scans alarmed.** TUI shows the silhouette via density; the same Event carries XYZ for richer downstream tools. The audit summary nails *which slot* (column, row) is empty."

[scenario.mindmap]
title = "Mindmap — LLM expands a query into a knowledge tree"
description = "Watch a BFS expansion of \"What is LLMesh?\" — 18 nodes across 5 branches. SPC fires when breadth crosses 12 (proxy for \"too broad\")."
intro_title = "Scenario: Mindmap"
intro = "**Live mindmap construction.** An LLM starts from a seed query and BFS-expands related concepts. Each node is a TRACE_SPAN; breadth drives an SPC alarm so we can detect \"runaway\" exploration. The final tree renders as an ASCII outline you can read top-to-bottom."
query_title = "Seed query"
query = "**Seed**: *What is LLMesh and what are its main capabilities?*  Root node: `LLMesh`."
alarm_title = "Breadth alarm"
alarm = "Tree breadth = **{breadth}** crossed the threshold of {threshold}. The query is exploring too many directions; in production you'd narrow the prompt or split into sub-queries."
takeaway_title = "Take-away"
takeaway = "**{breadth} nodes** in one expansion. Mindmap = a TRACE_SPAN tree, not a special data type. SPC on breadth catches \"too broad\" prompts before they drown the answer in tangents. The same adjacency rides on the final audit Event for downstream tools to render their own way."

[scenario.coin_toss]
title = "Coin toss — heads ratio settles near 1/2 (student-friendly)"
sensor_pane_title = "🪙 Toss outcomes  · 📖 read-only"
description = "Toss a fair coin {n} times and watch the heads ratio drift toward 0.50. SPC fires only if it strays far from 1/2 after 8+ tosses. No LLMesh knowledge required — just a friendly intro to the four panes."
intro_title = "Scenario: Coin toss"
intro = "**Toss a coin {n} times.** Each toss feeds the SensorStream (running heads ratio), the Audit log (every result), and — if early luck looks suspicious — the SPC alarm. Watch the ratio creep toward **0.50** (Law of Large Numbers in action)."
alarm_title = "Suspicious streak"
alarm = "After **{n}** tosses we have **{heads} heads / {tails} tails** (ratio = **{ratio}**). That's far from 0.50 — interesting! Could be early luck, could be a loaded coin. Keep watching."
takeaway_title = "Take-away"
takeaway = "**{heads} heads, {tails} tails** — final ratio **{ratio}**. The Law of Large Numbers wins: enough tosses, and a fair coin always hovers near 0.50. SPC alarms early help us spot whether the deviation is just bad luck or something to investigate."

[scenario.reliability]
title = "Reliability — ACK / RETRANSMIT / Watchdog"
description = "Lossy stream of 6 chunks. Watch RETRANSMIT recover dropped chunks 3 and 5 before STREAM_ACK arrives."
intro_title = "Scenario: Reliability"
intro = "**Reliability protocol**: `ChunkSender` + `MessageAssembler` recover from packet loss with ACK + RETRANSMIT (sent at most **once** to avoid amplification)."
step1_title = "Step 1 — send"
step1 = "**Step 1.** Sender pushes chunks 1-6. The network drops **#3** and **#5**."
step2_title = "Step 2 — detect"
step2 = "**Step 2.** Receiver's `MessageAssembler.check_timeouts()` notices gaps at seq=3 and seq=5 → emits **one** RETRANSMIT request."
step3_title = "Step 3 — recover"
step3 = "**Step 3.** Sender's `handle_retransmit()` re-sends **only** the missing chunks. No duplicate retries."
step4_title = "Step 4 — ack"
step4 = "**Step 4.** Receiver completes the message → emits `STREAM_ACK`. Sender's `handle_ack()` drops its buffer."
watchdog_title = "Bonus — watchdog"
watchdog = "If the receiver had gone silent, **WatchdogTimer** (NTP-checked clock) would have signalled a disconnect; `expire_old()` would have GC'd buffered chunks."
takeaway_title = "Take-away"
takeaway = "RETRANSMIT is sent **once** per gap to avoid retry storms / amplification. TTL guarantees buffers don't grow forever even on disconnect."
